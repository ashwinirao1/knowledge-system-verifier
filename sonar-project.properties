# SonarQube/SonarCloud scanner config (S0.6). Scan runs only when the runner has
# SONAR_TOKEN; coverage comes from coverage.py's cobertura-format coverage.xml.
sonar.projectKey=knowledge-system-verifier
sonar.projectName=knowledge-system-verifier

sonar.sources=answers,tools
sonar.tests=answers/tests
sonar.test.inclusions=answers/tests/**/*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.9,3.11
sonar.sourceEncoding=UTF-8

sonar.exclusions=answers/tests/baseline_selftest.json
