# ruff — dev/CI lint (S0.6). Kit dirs (harness/, starter/, eval/) are organizers' code.
line-length = 120
target-version = "py39"
exclude = [
    "harness",
    "starter",
    "eval",
    "snapshots",
    "snapshots_zip",
    "results*",
    ".venv",
]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "W"]

[lint.per-file-ignores]
"answers/tests/*" = ["B011"]  # assertions in tests are the point

